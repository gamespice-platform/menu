[plugin]

name="gs-menu"
description="In-game menus as data: pages of rows that are views of gs-settings, the stock audio, video and general settings with the code that applies them, rebindable keys with swap-on-conflict, a help screen, a numbered picker, a HUD layout editor, and whole-palette themes a game, a file or a server can add to or narrow. Depends on gs-core, gs-ui and gs-settings."
author="dot"
version="0.1.0"
script="gs_menu_plugin.gd"
